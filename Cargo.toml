[package]
name = "chira"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
jpeg-encoder = "0.6"
ort = { version = "=2.0.0-rc.10", features = ["cuda", "tensorrt", "ndarray"] }
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
